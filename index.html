<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warkop Mikita - PWA Menu</title>
    
    <!-- PWA Configurations -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- Tailwind CSS Engine -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-24">

    <!-- Header -->
    <header class="bg-slate-900 text-white p-4 sticky top-0 z-10 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-lg font-bold tracking-wide">Warkop Mikita</h1>
                <p class="text-xs text-slate-400">Pesan Menu Favoritmu</p>
            </div>
            <span class="bg-amber-500 text-slate-900 text-xs px-2 py-1 rounded font-bold">Buka</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- Form Nama Pelanggan -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <label for="customerName" class="block text-xs font-bold text-slate-600 mb-1">Nama Pemesan</label>
            <input type="text" id="customerName" placeholder="Masukkan nama Anda..." class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:border-slate-900">
        </section>

        <!-- Kategori Menu -->
        <section class="flex space-x-2 overflow-x-auto pb-2 scrollbar-none">
            <button class="cat-btn px-4 py-2 rounded-xl text-xs font-bold bg-slate-900 text-white transition shadow-sm flex-shrink-0" onclick="filterCategory('all', this)">Semua</button>
            <button class="cat-btn px-4 py-2 rounded-xl text-xs font-bold bg-white text-slate-600 hover:bg-slate-200 transition shadow-sm flex-shrink-0" onclick="filterCategory('minuman', this)">Minuman</button>
            <button class="cat-btn px-4 py-2 rounded-xl text-xs font-bold bg-white text-slate-600 hover:bg-slate-200 transition shadow-sm flex-shrink-0" onclick="filterCategory('makanan', this)">Makanan</button>
            <button class="cat-btn px-4 py-2 rounded-xl text-xs font-bold bg-white text-slate-600 hover:bg-slate-200 transition shadow-sm flex-shrink-0" onclick="filterCategory('camilan', this)">Camilan</button>
        </section>

        <!-- Daftar Menu -->
        <section id="menuContainer" class="grid grid-cols-1 gap-3">
            <!-- Menu Items dipanggil via JavaScript -->
        </section>
    </main>

    <!-- Navigation / Floating Bottom Cart Bar -->
    <div id="cartBar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-4 shadow-lg hidden">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <p class="text-xs text-slate-500"><span id="totalItems">0</span> Item dipilih</p>
                <p class="text-lg font-bold text-slate-900" id="totalPrice">Rp 0</p>
            </div>
            <button onclick="openModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold px-5 py-2.5 rounded-xl transition shadow">
                Cek Pesanan
            </button>
        </div>
    </div>

    <!-- Modal Ringkasan Pesanan -->
    <div id="orderModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-end sm:items-center justify-center hidden">
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-4 max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-slate-800">Detail Ringkasan Pesanan</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>
            
            <div id="modalCartList" class="overflow-y-auto flex-1 space-y-2 divide-y text-sm">
                <!-- Ringkasan Cart -->
            </div>

            <div class="border-t pt-3 space-y-2">
                <div class="flex justify-between font-bold text-slate-900">
                    <span>Total Pembayaran</span>
                    <span id="modalTotalPrice">Rp 0</span>
                </div>
                <button id="btnSendWA" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition flex items-center justify-center space-x-2">
                    <span>Kirim via WhatsApp</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // Database Menu
        const menuData = [
            { id: 1, name: 'Kopi Hitam Joss', category: 'minuman', price: 5000, desc: 'Kopi hitam mantap racikan khas' },
            { id: 2, name: 'Es Teh Manis', category: 'minuman', price: 4000, desc: 'Teh segar manis pas' },
            { id: 3, name: 'Indomie Goreng + Telur', category: 'makanan', price: 10000, desc: 'Indomie goreng pakai telur matang/setengah matang' },
            { id: 4, name: 'Nasi Goreng Warkop', category: 'makanan', price: 13000, desc: 'Nasi goreng porsi kenyang' },
            { id: 5, name: 'Gorengan (Isi 3)', category: 'camilan', price: 5000, desc: 'Bakwan / Tahu / Tempe goreng hangat' },
            { id: 6, name: 'Roti Bakar Cokelat Keju', category: 'camilan', price: 10000, desc: 'Roti bakar topping cokelat keju melimpah' }
        ];

        let cart = {};

        // Render Menu
        function renderMenu(items) {
            const container = document.getElementById('menuContainer');
            container.innerHTML = '';

            items.forEach(item => {
                const qty = cart[item.id] ? cart[item.id].qty : 0;
                container.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex justify-between items-center">
                        <div class="pr-2">
                            <h3 class="font-bold text-sm text-slate-800">${item.name}</h3>
                            <p class="text-xs text-slate-400 mb-1">${item.desc}</p>
                            <p class="text-sm font-bold text-slate-900">Rp ${item.price.toLocaleString('id-ID')}</p>
                        </div>
                        <div class="flex items-center space-x-2 bg-slate-100 p-1 rounded-xl">
                            <button onclick="updateCart(${item.id}, -1)" class="w-7 h-7 bg-white text-slate-700 rounded-lg font-bold text-sm shadow-sm flex items-center justify-center">-</button>
                            <span class="text-xs font-bold px-1">${qty}</span>
                            <button onclick="updateCart(${item.id}, 1)" class="w-7 h-7 bg-slate-900 text-white rounded-lg font-bold text-sm shadow-sm flex items-center justify-center">+</button>
                        </div>
                    </div>
                `;
            });
        }

        // Filter Kategori
        function filterCategory(category, element) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn px-4 py-2 rounded-xl text-xs font-bold bg-white text-slate-600 hover:bg-slate-200 transition shadow-sm flex-shrink-0";
            });
            element.className = "cat-btn px-4 py-2 rounded-xl text-xs font-bold bg-slate-900 text-white transition shadow-sm flex-shrink-0";

            if (category === 'all') {
                renderMenu(menuData);
            } else {
                renderMenu(menuData.filter(item => item.category === category));
            }
        }

        // Update Keranjang
        function updateCart(id, change) {
            const item = menuData.find(m => m.id === id);
            if (!cart[id]) {
                if (change > 0) cart[id] = { ...item, qty: change };
            } else {
                cart[id].qty += change;
                if (cart[id].qty <= 0) delete cart[id];
            }
            
            // Re-render UI
            const activeCategoryBtn = document.querySelector('.cat-btn.bg-slate-900');
            renderMenu(activeCategoryBtn.textContent.toLowerCase() === 'semua' ? menuData : menuData.filter(m => m.category === activeCategoryBtn.textContent.toLowerCase()));
            
            updateCartBar();
        }

        // Floating Cart Bar Update
        function updateCartBar() {
            const cartBar = document.getElementById('cartBar');
            let totalItems = 0;
            let totalPrice = 0;

            Object.values(cart).forEach(item => {
                totalItems += item.qty;
                totalPrice += item.price * item.qty;
            });

            if (totalItems > 0) {
                cartBar.classList.remove('hidden');
                document.getElementById('totalItems').innerText = totalItems;
                document.getElementById('totalPrice').innerText = 'Rp ' + totalPrice.toLocaleString('id-ID');
            } else {
                cartBar.classList.add('hidden');
            }
        }

        // Modal Controls
        function openModal() {
            const name = document.getElementById('customerName').value.trim();
            if (!name) {
                alert('Silakan masukkan nama Anda terlebih dahulu!');
                document.getElementById('customerName').focus();
                return;
            }

            const modalList = document.getElementById('modalCartList');
            modalList.innerHTML = '';
            let totalPrice = 0;

            Object.values(cart).forEach(item => {
                const subtotal = item.price * item.qty;
                totalPrice += subtotal;
                modalList.innerHTML += `
                    <div class="pt-2 flex justify-between items-center">
                        <div>
                            <p class="font-bold text-slate-800">${item.name}</p>
                            <p class="text-xs text-slate-500">${item.qty} x Rp ${item.price.toLocaleString('id-ID')}</p>
                        </div>
                        <span class="font-bold text-slate-800">Rp ${subtotal.toLocaleString('id-ID')}</span>
                    </div>
                `;
            });

            document.getElementById('modalTotalPrice').innerText = 'Rp ' + totalPrice.toLocaleString('id-ID');
            document.getElementById('orderModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('orderModal').classList.add('hidden');
        }

        // WhatsApp Integration + Geolocation GPS
        document.getElementById('btnSendWA').addEventListener('click', () => {
            const name = document.getElementById('customerName').value.trim();
            const phoneAdmin = "6281234567890"; // Ganti dengan nomor WhatsApp Warkop kamu

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    position => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        sendWA(name, phoneAdmin, `https://maps.google.com/?q=${lat},${lng}`);
                    },
                    error => {
                        sendWA(name, phoneAdmin, "Lokasi tidak diizinkan/akses dibatasi.");
                    }
                );
            } else {
                sendWA(name, phoneAdmin, "Device tidak mendukung GPS.");
            }
        });

        function sendWA(name, phone, locationText) {
            let message = `*PESANAN WARKOP MIKITA*\n`;
            message += `-------------------------\n`;
            message += `*Nama:* ${name}\n`;
            message += `*Lokasi:* ${locationText}\n\n`;
            message += `*Rincian Pesanan:*\n`;

            let totalPrice = 0;
            Object.values(cart).forEach(item => {
                const subtotal = item.price * item.qty;
                totalPrice += subtotal;
                message += `- ${item.name} (${item.qty}x) = Rp ${subtotal.toLocaleString('id-ID')}\n`;
            });

            message += `\n*Total:* Rp ${totalPrice.toLocaleString('id-ID')}\n`;
            message += `-------------------------\n`;
            message += `Mohon segera diproses ya, terima kasih!`;

            const encodedURL = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            window.open(encodedURL, '_blank');
        }

        // Register Service Worker untuk PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker Registered!', reg))
                    .catch(err => console.error('Service Worker Error:', err));
            });
        }

        // Inisialisasi Pertama
        renderMenu(menuData);
    </script>
</body>
</html>
