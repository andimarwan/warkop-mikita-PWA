<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warkop Mikita - Pesan Menu</title>
  
  <!-- PWA Setup -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#d97706">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { padding: 15px; max-width: 500px; margin: 0 auto; background: #f8fafc; color: #1e293b; }
    .header { text-align: center; padding: 10px 0; }
    .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 15px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 14px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f1f5f9; }
    .menu-item:last-child { border-bottom: none; }
    .qty-btn { width: 30px; height: 30px; border: none; background: #e2e8f0; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .qty-num { font-weight: bold; margin: 0 8px; }
    button.btn-kirim { width: 100%; padding: 14px; background: #d97706; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    #status { margin-top: 12px; padding: 10px; border-radius: 6px; text-align: center; font-size: 13px; font-weight: bold; }
    .success { background: #dcfce7; color: #166534; }
    .error { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>

  <div class="header">
    <h2 style="margin: 0; color: #b45309;">☕ Warkop Mikita</h2>
    <p style="margin: 5px 0; font-size: 13px; color: #64748b;">Pesan langsung dari meja kamu</p>
  </div>

  <div class="card">
    <div class="form-group">
      <label for="nama">Nama Pemesan:</label>
      <input type="text" id="nama" placeholder="Contoh: Budi">
    </div>
    <div class="form-group">
      <label for="meja">Nomor Meja:</label>
      <input type="number" id="meja" placeholder="Contoh: 05">
    </div>
  </div>

  <div class="card">
    <h4 style="margin-top: 0; margin-bottom: 10px;">Pilih Menu</h4>
    
    <div class="menu-item">
      <div><b>Kopi Hitam / Jos</b><br><small>Rp 5.000</small></div>
      <div>
        <button class="qty-btn" onclick="ubahQty('kopi', -1)">-</button>
        <span class="qty-num" id="qty-kopi">0</span>
        <button class="qty-btn" onclick="ubahQty('kopi', 1)">+</button>
      </div>
    </div>

    <div class="menu-item">
      <div><b>Es Teh Manis</b><br><small>Rp 5.000</small></div>
      <div>
        <button class="qty-btn" onclick="ubahQty('esteh', -1)">-</button>
        <span class="qty-num" id="qty-esteh">0</span>
        <button class="qty-btn" onclick="ubahQty('esteh', 1)">+</button>
      </div>
    </div>

    <div class="menu-item">
      <div><b>Indomie Goreng + Telur</b><br><small>Rp 10.000</small></div>
      <div>
        <button class="qty-btn" onclick="ubahQty('indomie', -1)">-</button>
        <span class="qty-num" id="qty-indomie">0</span>
        <button class="qty-btn" onclick="ubahQty('indomie', 1)">+</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="form-group">
      <label for="catatan">Catatan Tambahan (Opsional):</label>
      <input type="text" id="catatan" placeholder="Pedas manis / Es dikit aja">
    </div>

    <button class="btn-kirim" onclick="kirimPesanan()">Kirim Pesanan via WA</button>
    <div id="status"></div>
  </div>

  <script>
    // Konfigurasi Warkop Mikita
    const WARKOP_LAT = -6.200000; // Ganti titik koordinat Lat Warkop
    const WARKOP_LNG = 106.816666; // Ganti titik koordinat Lng Warkop
    const RADIUS_MAKSIMAL_METER = 50; // Maksimal jarak 50m dari warkop
    const NOMOR_WA_KASIR = "628123456789"; // Ganti nomor WA Kasir/Warkop (pakai 62)

    let pesanan = {
      kopi: { nama: 'Kopi Hitam/Jos', qty: 0 },
      esteh: { nama: 'Es Teh Manis', qty: 0 },
      indomie: { nama: 'Indomie Goreng + Telur', qty: 0 }
    };

    function ubahQty(id, delta) {
      if (pesanan[id].qty + delta >= 0) {
        pesanan[id].qty += delta;
        document.getElementById(`qty-${id}`).innerText = pesanan[id].qty;
      }
    }

    function hitungJarak(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const rad = Math.PI / 180;
      const dLat = (lat2 - lat1) * rad;
      const dLon = (lon2 - lon1) * rad;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * rad) * Math.cos(lat2 * rad) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function kirimPesanan() {
      const nama = document.getElementById('nama').value.trim();
      const meja = document.getElementById('meja').value.trim();
      const catatan = document.getElementById('catatan').value.trim();
      const statusDiv = document.getElementById('status');

      if (!nama || !meja) {
        statusDiv.className = "error";
        statusDiv.innerText = "Isi Nama dan Nomor Meja dulu ya!";
        return;
      }

      let daftarPesananText = "";
      for (let key in pesanan) {
        if (pesanan[key].qty > 0) {
          daftarPesananText += `%0A- ${pesanan[key].nama} x${pesanan[key].qty}`;
        }
      }

      if (!daftarPesananText) {
        statusDiv.className = "error";
        statusDiv.innerText = "Pilih minimal 1 menu!";
        return;
      }

      statusDiv.className = "";
      statusDiv.innerText = "Mengecek lokasi kamu di warkop...";

      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const jarak = hitungJarak(pos.coords.latitude, pos.coords.longitude, WARKOP_LAT, WARKOP_LNG);

            if (jarak <= RADIUS_MAKSIMAL_METER) {
              statusDiv.className = "success";
              statusDiv.innerText = "Lokasi terverifikasi! Membuka WhatsApp...";

              let pesanWA = `*PESANAN WARKOP MIKITA*%0A`;
              pesanWA += `Nama: ${nama}%0A`;
              pesanWA += `Meja: ${meja}%0A`;
              pesanWA += `%0A*Detail Pesanan:*${daftarPesananText}%0A`;
              if (catatan) pesanWA += `%0A*Catatan:* ${catatan}%0A`;
              pesanWA += `%0A_(Lokasi Terverifikasi di Warkop - ${Math.round(jarak)}m)_`;

              setTimeout(() => {
                window.location.href = `https://wa.me/${NOMOR_WA_KASIR}?text=${pesanWA}`;
              }, 1200);

            } else {
              statusDiv.className = "error";
              statusDiv.innerText = `Kamu berada di luar area Warkop Mikita (${Math.round(jarak)}m). Pemesanan hanya bisa dilakukan di lokasi.`;
            }
          },
          () => {
            statusDiv.className = "error";
            statusDiv.innerText = "Aktifkan GPS HP kamu untuk pesan menu!";
          },
          { enableHighAccuracy: true }
        );
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
